<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress harmless Vite HMR WebSocket errors in AI Studio iFrame environment
      (function() {
        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://') || msg.includes('closed without opened')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event.reason && (event.reason.message || String(event.reason))) || '';
          if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://') || msg.includes('closed without opened')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return typeof a === 'object' ? (a && a.message ? a.message : JSON.stringify(a)) : String(a); }).join(' ');
          if (str.includes('WebSocket') || str.includes('closed without opened')) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
